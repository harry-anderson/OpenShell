name: Build fork images

on:
  workflow_dispatch:
  push:
    branches:
      - feat/ssh-agent-forward-upstream

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev protobuf-compiler

      - name: Build gateway, supervisor, and sandbox
        run: cargo build --release -p openshell-gateway -p openshell-supervisor -p openshell-sandbox

      - name: Stage binaries
        run: |
          set -euo pipefail
          dest=deploy/docker/.build/prebuilt-binaries/arm64
          mkdir -p "$dest"
          install -m 0755 target/release/openshell-gateway "$dest/openshell-gateway"
          install -m 0755 target/release/openshell-supervisor "$dest/openshell-supervisor"
          install -m 0755 target/release/openshell-sandbox "$dest/openshell-sandbox"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway and supervisor
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA::12}"
          for component in gateway supervisor; do
            docker buildx build \
              --platform linux/arm64 \
              --file "deploy/docker/Dockerfile.${component}" \
              --target "$component" \
              --tag "ghcr.io/harry-anderson/openshell/${component}:${sha}" \
              --tag "ghcr.io/harry-anderson/openshell/${component}:fork-dev" \
              --provenance=false \
              --sbom=false \
              --push \
              .
          done

      - name: Build and push sandbox
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA::12}"
          docker buildx build \
            --platform linux/arm64 \
            --file deploy/docker/Dockerfile.sandbox-gnu \
            --tag "ghcr.io/harry-anderson/openshell/sandbox:${sha}" \
            --tag "ghcr.io/harry-anderson/openshell/sandbox:fork-dev" \
            --provenance=false \
            --sbom=false \
            --push \
            .
